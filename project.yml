name: Invoices
options:
  bundleIdPrefix: com.domenperko
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: sl

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Invoices:
    type: application
    platform: macOS
    sources:
      - path: Invoices
        excludes:
          # Claude Code parks git worktrees here; they hold a second copy of every source.
          - ".claude/**"
    settings:
      base:
        # The bundle is named per configuration (below), but the Swift module
        # is not: the tests say `@testable import Invoices` either way.
        PRODUCT_MODULE_NAME: Invoices
        CODE_SIGN_ENTITLEMENTS: Invoices/App/Invoices.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Debug is the copy you run from Xcode, Release the one you install.
        # They differ in both name and bundle id on purpose: the name is what
        # Spotlight lists (it labels apps by file name, not display name), and
        # the id gives the development build its own sandbox container, so
        # experimenting never touches the invoices in the installed app.
        Debug:
          PRODUCT_NAME: Invoices Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.Invoices.dev
        Release:
          PRODUCT_NAME: Invoices
          PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.Invoices
    info:
      path: Invoices/App/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: ""

  InvoicesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/InvoicesTests
    dependencies:
      - target: Invoices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.InvoicesTests
        GENERATE_INFOPLIST_FILE: YES
      # The tests run inside the app, so the host path has to follow whichever
      # name that configuration builds under.
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Invoices Dev.app/Contents/MacOS/Invoices Dev"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Invoices.app/Contents/MacOS/Invoices"

schemes:
  Invoices:
    build:
      targets:
        Invoices: all
        InvoicesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InvoicesTests
