name: Invoices
options:
  bundleIdPrefix: com.domenperko
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"

targets:
  Invoices:
    type: application
    platform: macOS
    sources:
      - path: Invoices
        excludes:
          # Claude Code parks git worktrees here; they hold a second copy of every source.
          - ".claude/**"
    dependencies:
      - package: Sparkle
    settings:
      base:
        # The bundle is named per configuration (below), but the Swift module
        # is not: the tests say `@testable import Invoices` either way.
        PRODUCT_MODULE_NAME: Invoices
        CODE_SIGN_ENTITLEMENTS: Invoices/App/Invoices.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Debug is the copy you run from Xcode, Release the one you install.
        # They differ in both name and bundle id on purpose: the name is what
        # Spotlight lists (it labels apps by file name, not display name), and
        # the id gives the development build its own sandbox container, so
        # experimenting never touches the invoices in the installed app.
        Debug:
          PRODUCT_NAME: Invoices Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.Invoices.dev
        Release:
          PRODUCT_NAME: Invoices
          PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.Invoices
    info:
      path: Invoices/App/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: ""
        # Sparkle. /releases/latest/download/ redirects to whichever release is
        # newest, so the feed the app is built with never has to change and
        # there is nothing to host.
        SUFeedURL: https://github.com/perkzen/invoices/releases/latest/download/appcast.xml
        SUPublicEDKey: 4rQ1hMdGuWrYw/8xIYaDAFjfJeZujQj8lwkTsiIbzNk=
        # Mandatory for a sandboxed app: the sandbox forbids an app from
        # replacing its own bundle, so the install runs in an XPC service.
        SUEnableInstallerLauncherService: true

  # `invoices`, the command-line tool: the app's ledger for scripts and for
  # coding agents (see skills/invoices/SKILL.md). It compiles the app's own
  # models, rules and renderers rather than linking a framework, so there is
  # nothing to embed and nothing that could disagree with the app; it opens
  # the app's store by path. It is not sandboxed, and it has no resources: the
  # Slovenian document strings are read from the installed app at run time.
  InvoicesCLI:
    type: tool
    platform: macOS
    sources:
      - Invoices/Models
      - Invoices/Core
      - Invoices/Services
      # The PDF page names the private-mode mask; nothing else from App/.
      - Invoices/App/PrivacyMode.swift
      - CLI
    dependencies:
      - package: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: invoices
        PRODUCT_MODULE_NAME: InvoicesCLI
        CODE_SIGN_STYLE: Automatic

  InvoicesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/InvoicesTests
    dependencies:
      - target: Invoices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.InvoicesTests
        GENERATE_INFOPLIST_FILE: YES
      # The tests run inside the app, so the host path has to follow whichever
      # name that configuration builds under.
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Invoices Dev.app/Contents/MacOS/Invoices Dev"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Invoices.app/Contents/MacOS/Invoices"

schemes:
  Invoices:
    build:
      targets:
        Invoices: all
        InvoicesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InvoicesTests

  InvoicesCLI:
    build:
      targets:
        InvoicesCLI: all
    run:
      config: Debug
