name: Invoices
options:
  bundleIdPrefix: com.domenperko
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: sl

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

targets:
  Invoices:
    type: application
    platform: macOS
    sources:
      - path: Invoices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.Invoices
        PRODUCT_NAME: Invoices
        CODE_SIGN_ENTITLEMENTS: Invoices/App/Invoices.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Invoices/App/Info.plist
      properties:
        CFBundleName: Invoices
        CFBundleDisplayName: Invoices
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: ""

  InvoicesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/InvoicesTests
    dependencies:
      - target: Invoices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domenperko.InvoicesTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Invoices:
    build:
      targets:
        Invoices: all
        InvoicesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InvoicesTests
